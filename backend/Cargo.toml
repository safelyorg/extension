[package]
name = "backend"
version = "1.0.2"
edition = "2024"

[dependencies]
axum = {version = "0.8.9", features = ["multipart"]}
axum-extra = { version = "0.12.6", features = ["cookie"] }
chrono = { version = "0.4.45", features = ["serde"] }
# chrono-tz = "0.10.4"
dotenvy = "0.15.7"
genpdf = "0.2.0"
hex = "0.4.3"
hmac = "0.13.0"
once_cell = "1.21.4"
regex = "1.13.1"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
scraper = "0.27.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio", "uuid", "tls-native-tls", "chrono", "macros"] }
tera = "2.1.0"
time = "0.3.53"
tokio = { version = "1.52.3", features = ["full"] }
tower-http = { version = "0.7.0", features = ["fs", "cors", "set-header"] }
urlencoding = "2.1.3"
uuid = { version = "1.23.3", features = ["serde", "v7", "v4"] }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
http-body-util = "0.1.4"
serial_test = "4.0.1"
wiremock = "0.6.5"
